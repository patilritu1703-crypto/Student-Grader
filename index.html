
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      color: #1e293b;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 12px 40px #33415520;
    }

    h1 { margin: 0 0 10px; font-size: 26px; }
    .subtitle { color: #64748b; margin-bottom: 28px; }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #818cf8;
      border-color: #6366f1;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #4338ca; }

    #result {
      margin-top: 22px;
      padding: 16px;
      border-radius: 10px;
      background: #eef2ff;
      display: none;
      line-height: 1.8;
    }

    #error { color: #dc2626; margin-top: 14px; }
    .grade { font-size: 28px; font-weight: bold; color: #4338ca; }
    footer { margin-top: 22px; text-align: center; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Student Grade Calculator</h1>
    <p class="subtitle">Enter student details to calculate the grade.</p>

    <form id="gradeForm">
      <label for="studentName">Student Name</label>
      <input id="studentName" type="text"
             placeholder="Enter student name" required>

      <label for="marks">Marks (0–100)</label>
      <input id="marks" type="number" min="0" max="100"
             step="any" placeholder="Enter marks" required>

      <button type="submit">Calculate Grade</button>
    </form>

    <p id="error" role="alert"></p>
    <section id="result" aria-live="polite"></section>

    <footer>Python Internship Task 2 · Student Grade Calculator</footer>
  </main>

  <script>
    const form = document.getElementById("gradeForm");
    const result = document.getElementById("result");
    const error = document.getElementById("error");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("studentName").value.trim();
      const marks = Number(document.getElementById("marks").value);

      result.style.display = "none";
      error.textContent = "";

      if (!name) {
        error.textContent = "Please enter the student's name.";
        return;
      }

      if (document.getElementById("marks").value.trim() === "" ||
          !Number.isFinite(marks) || marks < 0 || marks > 100) {
        error.textContent = "Please enter marks between 0 and 100.";
        return;
      }

      let grade;

      if (marks >= 90) grade = "A+";
      else if (marks >= 80) grade = "A";
      else if (marks >= 70) grade = "B";
      else if (marks >= 60) grade = "C";
      else if (marks >= 40) grade = "D";
      else grade = "F";

      const status = marks >= 40 ? "Pass" : "Fail";

      result.innerHTML = `
        <div>Student: <strong></strong></div>
        <div>Marks: <strong>${marks}</strong></div>
        <div>Grade: <span class="grade">${grade}</span></div>
        <div>Result: <strong>${status}</strong></div>
      `;

      result.querySelector("div strong").textContent = name;
      result.style.display = "block";
    });
  </script>
</body>
</html>
